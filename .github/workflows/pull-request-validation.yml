name: Backend pull request validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: validation
          POSTGRES_PASSWORD: validation-only
          POSTGRES_DB: radiusfiber_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U validation -d radiusfiber_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://validation:validation-only@127.0.0.1:5432/radiusfiber_validation
      RADIUSFIBER_DISPOSABLE_TEST_DATABASE_URL: postgresql://validation:validation-only@127.0.0.1:5432/radiusfiber_validation
      JWT_SECRET: ci-validation-only
      PAYSTACK_ENABLED: "false"
      DEFAULT_ORGANIZATION_SLUG: smart-fiber

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install authoritative dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Reject tracked local or generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '(^|/)\.env$|(^|/)(venv|__pycache__|dist)/|\.(dump|tgz|tar\.gz|zip|log|pyc)$' || true)"
          if [[ -n "$forbidden" ]]; then
            printf 'Tracked local/generated artifacts found:\n%s\n' "$forbidden"
            exit 1
          fi
          if git grep -nEI 'sk_(live|test)_[A-Za-z0-9]+|gh[pousr]_[A-Za-z0-9]+|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- ':!.github/workflows/pull-request-validation.yml'; then
            echo "Secret-like material found in tracked source."
            exit 1
          fi

      - name: Compile application and migrations
        run: python -m compileall -q app alembic scripts

      - name: Import FastAPI and inspect routes
        run: python -c "from app.main import app; print('IMPORT_OK', len(app.routes))"

      - name: Inspect Alembic metadata
        run: |
          alembic heads
          alembic branches
          alembic history

      - name: Rehearse disposable PostgreSQL migration
        run: python -m scripts.ci_postgresql_validation

      - name: Require PostgreSQL-gated safety tests
        run: >-
          python -m scripts.run_tests_no_skips
          tests.test_expiry_canary_safety.ExpiryCanaryPostgresTests

      - name: Run formal tests when present
        shell: bash
        run: |
          if [[ -d tests ]]; then
            python -m scripts.run_tests_no_skips
          else
            echo "::notice::No formal tests directory exists; isolated staging validation is recorded in the pull request."
          fi
